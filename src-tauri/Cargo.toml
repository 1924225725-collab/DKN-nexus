[package]
name = "dkn-nexus"
version = "1.6.22"
description = "DKN Nexus desktop hub"
authors = ["夜雨声烦"]
edition = "2021"

[lib]
name = "dkn_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2.8.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-opener = "2.4.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.1"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
